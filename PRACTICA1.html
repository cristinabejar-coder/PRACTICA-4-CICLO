<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container py-4">

        <h1>Catalogo de productos</h1>
        <br>

        <div class="row row-cols-4">

            <div class="col">
                <div class="card border-primary h-100">
                    <img class="card-img-top" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx2o6JU3zrLWJRHQFIiYbT8DA5Ay36ZvELbXO3w6NIQh-lm4lc2INCzvs&s=10" alt="">

                    <div class="card-body">
                        <h1 class="h5 card-title">Laptop Gamer</h1>

                        <span class="badge bg-primary">S/ 4,500</span>

                        <p class="card-text">
                            Core i7, 16GB RAM, SSD 512GB.
                        </p>

                        <button class="btn btn-primary">Añadir al Carrito</button>
                    </div>
                </div>
            </div>


            <div class="col">
                <div class="card border-success h-100">
                    <img class="card-img-top" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRINc01PwCn3UpQg7xxWCjL-2EWBiSr_HgYCzAUoi2eyg&s=10" alt="">

                    <div class="card-body">
                        <h1 class="h5 card-title">Mouse Inalámbrico</h1>

                        <span class="badge bg-success">S/ 120</span>

                        <p class="card-text">
                            Sensor óptico de alta precisión.
                        </p>

                        <button class="btn btn-success">Añadir al Carrito</button>
                    </div>
                </div>
            </div>


            <div class="col">
                <div class="card border-warning h-100">
                    <img class="card-img-top" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTysQ5VgQNjP_CGEraxQN_D_ZZ9zbL4BdiyeCDFYlf30vdIWuRe6WVNCZpO&s=10" alt="">

                    <div class="card-body">
                        <h1 class="h5 card-title">Teclado Mecánico</h1>

                        <span class="badge bg-warning">S/ 280</span>

                        <p class="card-text">
                            Switches Blue e iluminación RGB.
                        </p>

                        <button class="btn btn-warning">Añadir al Carrito</button>
                    </div>
                </div>
            </div>


            <div class="col">
                <div class="card border-danger h-100">
                    <img class="card-img-top" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQC4sNoo1SWUSNhsFAijQWVio5EDB2URU69U2bQlSpu2Q&s$" alt="">

                    <div class="card-body">
                        <h1 class="h5 card-title">Monitor 27 4K</h1>

                        <span class="badge bg-danger">S/ 1,350</span>

                        <p class="card-text">
                            Panel IPS con tasa de refresco de 144Hz
                        </p>

                        <button class="btn btn-danger">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
